# The Pi's config, installed once as /etc/ambient-room.toml by
# setup/install.sh; later edits on the Pi are kept.

# The other programs on the Pi that play through the same speakers: only
# one plays at a time (ambient/peers.py). 8000: piano-recorder's practice
# recorder; 8002: its exercise app (2026-10-13).
peers = ["http://127.0.0.1:8000", "http://127.0.0.1:8002"]

[output]
engine = "csound"
# piano-recorder's slot 3: the Scarlett 18i8 3rd Gen (from 2026-10-14). plughw puts the
# stereo on its PCM 1-2, which its internal mixer sends to the speakers. Its facts are in
# that project's docs/components.md. (Before: the BMG-04F, plughw:CARD=spker,DEV=0.)
device = "plughw:CARD=USB,DEV=0"
# aplay's buffer. Large, because the Pi 3's USB is the weak point and the
# music needs no quick response.
buffer_ms = 400
# Output trim, dB. At volume 1 the default sound should land near
# -21 dBFS gated rms per channel, the level takes are calibrated to
# (tools/calibrate). Measured 2026-10-11: the moods at volume 1 render at
# -25 to -28.5 dBFS without a trim, peaks -7.7 dBFS at most.
gain_db = 6.0

[web]
host = "0.0.0.0"
port = 8001

[state]
# The last settings, kept across restarts.
file = "~/.local/share/ambient-room/state.json"
